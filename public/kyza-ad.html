<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KYZA — Ideas in Motion (loop preview)</title>
<style>
  :root{
    --cream:#F4EFE1;
    --cream-dark:#EAE2CC;
    --sage:#8CA184;
    --sage-light:#B7C6AC;
    --stone:#7C93A3;
    --stone-light:#AFC0CB;
    --charcoal:#2E2B27;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#DAD3C0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .stage{
    width:min(92vw,900px);
    aspect-ratio:9/5;
    background:var(--cream);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(30,28,24,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
    position:relative;
  }
  svg{display:block;width:100%;height:100%;}

  .camera{
    animation: camera-pan 10s linear infinite;
  }
  @keyframes camera-pan{
    0%   { transform:translateX(0px); }
    18%  { transform:translateX(0px); }
    22%  { transform:translateX(-900px); }
    32%  { transform:translateX(-900px); }
    36%  { transform:translateX(-1500px); }
    46%  { transform:translateX(-1500px); }
    50%  { transform:translateX(-2100px); }
    60%  { transform:translateX(-2100px); }
    64%  { transform:translateX(-2700px); }
    74%  { transform:translateX(-2700px); }
    78%  { transform:translateX(-3300px); }
    90%  { transform:translateX(-3300px); }
    100% { transform:translateX(0px); }
  }

  .thread{
    fill:none;
    stroke:var(--sage);
    stroke-width:4.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:url(#roughen);
    animation: draw-thread 10s linear infinite;
  }
  @keyframes draw-thread{
    0%   { stroke-dashoffset:1000; }
    78%  { stroke-dashoffset:0; }
    90%  { stroke-dashoffset:0; }
    100% { stroke-dashoffset:1000; }
  }

  .scene-a{ animation: fade-a 10s linear infinite; }
  @keyframes fade-a{
    0%{opacity:0;} 6%{opacity:1;} 16%{opacity:1;} 20%{opacity:0;} 100%{opacity:0;}
  }
  .scene-b{ animation: fade-b 10s linear infinite; opacity:0; }
  @keyframes fade-b{
    22%{opacity:0;} 26%{opacity:1;} 32%{opacity:1;} 36%{opacity:0;}
  }
  .scene-c{ animation: fade-c 10s linear infinite; opacity:0; }
  @keyframes fade-c{
    36%{opacity:0;} 40%{opacity:1;} 46%{opacity:1;} 50%{opacity:0;}
  }
  .scene-d{ animation: fade-d 10s linear infinite; opacity:0; }
  @keyframes fade-d{
    50%{opacity:0;} 54%{opacity:1;} 60%{opacity:1;} 64%{opacity:0;}
  }
  .scene-e{ animation: fade-e 10s linear infinite; opacity:0; }
  @keyframes fade-e{
    64%{opacity:0;} 68%{opacity:1;} 74%{opacity:1;} 78%{opacity:0;}
  }
  .scene-f{ animation: fade-f 10s linear infinite; opacity:0; }
  @keyframes fade-f{
    78%{opacity:0;} 82%{opacity:1;} 88%{opacity:1;} 92%{opacity:0;}
  }

  .label-title{
    font-family:Georgia,'Iowan Old Style',serif;
    letter-spacing:2px;
  }
  .label-small{
    font-family:'Helvetica Neue',Arial,sans-serif;
    letter-spacing:2.5px;
    text-transform:uppercase;
  }

  .grain{
    mix-blend-mode:multiply;
    opacity:0.05;
  }

  .caption{
    position:absolute;
    bottom:10px;
    right:16px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:1px;
    color:rgba(46,43,39,0.35);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .camera,.thread,.scene-a,.scene-b,.scene-c,.scene-d,.scene-e,.scene-f{
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- hand-drawn wobble for linework -->
      <filter id="roughen" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
      </filter>
      <!-- soft shadow -->
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E2B27" flood-opacity="0.14"/>
      </filter>
      <!-- paper grain -->
      <filter id="paper">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.17  0 0 0 0 0.15  0 0 0 0.55 0"/>
      </filter>
      <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--cream)"/>
        <stop offset="1" stop-color="var(--cream-dark)"/>
      </linearGradient>
    </defs>

    <!-- static frame background -->
    <rect width="900" height="500" fill="var(--cream)"/>

    <!-- panning camera group : total strip width 3900 -->
    <g class="camera">
      <rect x="0" y="0" width="3900" height="500" fill="url(#bgFade)"/>

      <!-- ===================== SCENE A — KYZA ===================== -->
      <g class="scene-a">
        <circle cx="820" cy="70" r="3" fill="var(--sage)"/>
        <circle cx="835" cy="80" r="2" fill="var(--stone)"/>
        <text x="450" y="270" text-anchor="middle" class="label-title"
              font-size="108" font-weight="700" fill="var(--charcoal)">KYZA</text>
        <line x1="330" y1="305" x2="570" y2="305" stroke="var(--sage)" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- ===================== SCENE B — NOVA ===================== -->
      <g class="scene-b" transform="translate(900,0)">
        <rect x="200" y="150" width="200" height="130" rx="18" fill="none"
              stroke="var(--charcoal)" stroke-width="3.5" filter="url(#soft)"/>
        <circle cx="240" cy="195" r="9" fill="var(--sage)"/>
        <rect x="262" y="188" width="100" height="14" rx="7" fill="var(--sage-light)"/>
        <circle cx="360" cy="235" r="9" fill="var(--stone)"/>
        <rect x="238" y="228" width="100" height="14" rx="7" fill="var(--stone-light)"/>
        <text x="300" y="330" text-anchor="middle" class="label-title"
              font-size="46" font-weight="700" fill="var(--charcoal)">NOVA</text>
        <text x="300" y="356" text-anchor="middle" class="label-small"
              font-size="12" fill="var(--stone)">Ideas &amp; conversation</text>
      </g>

      <!-- ===================== SCENE C — ATLAS ===================== -->
      <g class="scene-c" transform="translate(1500,0)">
        <g filter="url(#soft)">
          <!-- maze grid -->
          <g fill="none" stroke="var(--sage-light)" stroke-width="2.5">
            <rect x="190" y="140" width="240" height="140"/>
            <line x1="230" y1="140" x2="230" y2="220"/>
            <line x1="270" y1="180" x2="270" y2="280"/>
            <line x1="310" y1="140" x2="310" y2="220"/>
            <line x1="350" y1="180" x2="350" y2="280"/>
            <line x1="390" y1="140" x2="390" y2="220"/>
          </g>
          <!-- resolved path -->
          <path d="M200,270 L200,230 L245,230 L245,190 L330,190 L330,230 L400,230 L400,150"
                fill="none" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="300" y="330" text-anchor="middle" class="label-title"
              font-size="46" font-weight="700" fill="var(--charcoal)">ATLAS</text>
        <text x="300" y="356" text-anchor="middle" class="label-small"
              font-size="12" fill="var(--stone)">Reason &amp; problem solving</text>
      </g>

      <!-- ===================== SCENE D — HELIX ===================== -->
      <g class="scene-d" transform="translate(2100,0)">
        <g filter="url(#soft)">
          <text x="185" y="235" font-family="Georgia,serif" font-size="70" fill="var(--sage)">&lt;</text>
          <text x="395" y="235" font-family="Georgia,serif" font-size="70" fill="var(--sage)">/&gt;</text>
          <rect x="235" y="175" width="130" height="10" rx="5" fill="var(--stone-light)"/>
          <rect x="235" y="200" width="90"  height="10" rx="5" fill="var(--sage-light)"/>
          <rect x="235" y="225" width="150" height="10" rx="5" fill="var(--stone-light)"/>
          <rect x="235" y="250" width="70"  height="10" rx="5" fill="var(--sage-light)"/>
        </g>
        <text x="300" y="330" text-anchor="middle" class="label-title"
              font-size="46" font-weight="700" fill="var(--charcoal)">HELIX</text>
        <text x="300" y="356" text-anchor="middle" class="label-small"
              font-size="12" fill="var(--stone)">Code &amp; technical work</text>
      </g>

      <!-- ===================== SCENE E — PRISM ===================== -->
      <g class="scene-e" transform="translate(2700,0)">
        <g filter="url(#soft)">
          <rect x="200" y="150" width="200" height="140" rx="10" fill="var(--cream)"
                stroke="var(--charcoal)" stroke-width="3.5"/>
          <circle cx="255" cy="200" r="16" fill="var(--sage-light)"/>
          <path d="M215,270 L270,215 L305,250 L340,220 L385,270 Z" fill="var(--stone-light)"/>
        </g>
        <text x="300" y="330" text-anchor="middle" class="label-title"
              font-size="46" font-weight="700" fill="var(--charcoal)">PRISM</text>
        <text x="300" y="356" text-anchor="middle" class="label-small"
              font-size="12" fill="var(--stone)">Image generation</text>
      </g>

      <!-- ===================== SCENE F — OUTRO ===================== -->
      <g class="scene-f" transform="translate(3300,0)">
        <path d="M180,250 C260,200 340,200 420,250" fill="none" stroke="var(--sage-light)"
              stroke-width="2.5" stroke-linecap="round"/>
        <path d="M480,250 C560,200 640,200 720,250" fill="none" stroke="var(--stone-light)"
              stroke-width="2.5" stroke-linecap="round"/>
        <text x="450" y="235" text-anchor="middle" class="label-title"
              font-size="52" font-weight="700" fill="var(--charcoal)">One KYZA.</text>
        <text x="450" y="285" text-anchor="middle" class="label-small"
              font-size="15" fill="var(--stone)">Think beyond the prompt.</text>
      </g>

      <!-- ===================== THE THREAD ===================== -->
      <path class="thread" pathLength="1000" stroke-dasharray="1000"
            d="M0,300
               C150,260 300,340 450,300
               C620,260 760,300 900,290
               C1050,270 1250,320 1400,290
               C1520,270 1650,310 1800,280
               C1950,255 2150,300 2300,280
               C2450,260 2550,300 2700,285
               C2850,265 3020,300 3150,285
               C3280,270 3420,270 3560,270
               C3700,270 3800,270 3900,270"/>
    </g>

    <!-- static overlays, unaffected by camera -->
    <rect class="grain" width="900" height="500" filter="url(#paper)"/>
  </svg>
  <div class="caption"></div>
</div>

</body>
</html>
