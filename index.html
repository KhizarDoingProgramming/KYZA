    <meta name="description" content="KYZA is an advanced AI assistant designed to help users with natural language tasks, coding, and information retrieval. Talk to Kyza or Nina in live mode." />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('kyza-theme');
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      .preloader-container {
        height: 100vh;
        height: 100dvh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #171717; /* Default dark */
      }
      html[data-theme='light'] .preloader-container {
        background: #ffffff;
      }
      .cat-outline {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: drawOutline 12s linear infinite;
      }
      html[data-theme='light'] .cat-outline {
        stroke: #171717;
      }
      .cat-detail {
        fill: none;
        stroke: #ff9800;
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: drawDetail 12s linear infinite;
      }
      .cat-detail-1 { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
      .cat-detail-2 { stroke-dasharray: 500; stroke-dashoffset: 500; }
      .cat-detail-3 { stroke-dasharray: 100; stroke-dashoffset: 100; }
      @keyframes drawOutline {
        0% { stroke-dashoffset: 2000; opacity: 0.3; }
        30%, 80% { stroke-dashoffset: 0; opacity: 1; }
        95%, 100% { stroke-dashoffset: 2000; opacity: 0.3; }
      }
      @keyframes drawDetail {
        0%, 30% { stroke-dashoffset: 1000; opacity: 0; }
        50%, 80% { stroke-dashoffset: 0; opacity: 1; }
        95%, 100% { stroke-dashoffset: 1000; opacity: 0; }
      }
    </style>
